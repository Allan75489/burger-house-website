<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos | Sistema Administrativo</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body class="admin-page" data-active="pedidos">

    <div id="sidebar-placeholder"></div>

    <div class="main-content">

        <header class="main-header">
            <div class="user-greeting">Gestão de Pedidos</div>
        </header>

        <section class="orders-wrapper">
            <table class="orders-table">
                <thead>
                    <tr>
                        <th>#Pedido</th>
                        <th>Cliente</th>
                        <th>Item</th>
                        <th>Valor</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <!-- As linhas são renderizadas dinamicamente por pedidos.js -->
                <tbody id="corpo-tabela-pedidos"></tbody>
            </table>
        </section>

    </div>

    <footer class="admin-footer">
        <p>&copy; 2026 Fire Burger House. Todos os direitos reservados.</p>
    </footer>

    <script src="../../assets/js/utils.js"></script>
    <script src="../../assets/js/pedidos.js"></script>
    <script src="../../assets/js/main.js"></script>

</body>
</html>
