<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promoções - Fire Burger House</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/promocoes.css">
</head>

<body class="promocoes-page">

    <a href="cardapio.html" class="voltar-cardapio">⬅ Voltar para o Cardápio</a>

    <!-- 🔥 SEÇÃO DE PROMOÇÕES -->
    <section class="promocoes">
        <h2>🔥 Promoções da Semana</h2>

        <!-- Os cards de promoção são renderizados dinamicamente por produtos.js -->
        <div class="container-promocoes" id="grid-promocoes"></div>
    </section>

    <!-- BOTÃO CARRINHO -->
    <button class="btn-carrinho-flutuante" id="btn-abrir-carrinho" type="button" aria-label="Abrir carrinho">
        🛒
        <span id="contador">0</span>
    </button>

    <!-- OVERLAY -->
    <div id="overlay"></div>

    <!-- CARRINHO (DRAWER) -->
    <aside id="carrinho-drawer" class="carrinho-drawer">
        <div class="topo-drawer">
            <h2>🛒 Carrinho</h2>
            <button id="btn-fechar-carrinho" type="button" aria-label="Fechar carrinho">✖</button>
        </div>

        <div id="itens"></div>

        <div class="total">
            <p>Total: <span id="total-drawer">R$ 0,00</span></p>
        </div>

        <button id="btn-finalizar-pedido-drawer" class="btn-finalizar" type="button">
            Finalizar Pedido
        </button>

        <button id="btn-limpar-carrinho-drawer" class="btn-limpar" type="button">
            Limpar Carrinho
        </button>
    </aside>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/carrinho.js"></script>
    <script src="../assets/js/produtos.js"></script>
    <script src="../assets/js/main.js"></script>

</body>
</html>
