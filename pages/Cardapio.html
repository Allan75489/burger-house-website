<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio - Fire Burger House</title>

    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/cardapio.css">
</head>

<body data-active="cardapio">

    <div id="navbar-placeholder"></div>

    <div class="top-bar top-bar--cardapio">
        <a href="promocoes.html" class="btn-nova-promocao">➕ Promoções da Semana</a>
        <a href="home.html" class="btn-home">🏠 Home</a>
    </div>

    <div id="header-placeholder" data-subtitle="Nosso Cardápio"></div>

    <!-- FILTROS DE CATEGORIA -->
    <div class="container">
        <div class="filtros">
            <button class="filtro-btn active" type="button" data-categoria="todos">Todos</button>
            <button class="filtro-btn" type="button" data-categoria="hamburguer">🍔 Hambúrgueres</button>
            <button class="filtro-btn" type="button" data-categoria="batata">🍟 Batatas</button>
            <button class="filtro-btn" type="button" data-categoria="bebida">🥤 Bebidas</button>
            <button class="filtro-btn" type="button" data-categoria="sobremesa">🍨 Sobremesas</button>
        </div>
    </div>

    <main class="cardapio-container">
        <!-- As categorias e produtos são renderizados dinamicamente por produtos.js -->
        <div id="categorias-cardapio"></div>
    </main>

    <!-- CARRINHO -->
    <aside id="carrinho" class="carrinho-painel">
        <h3>🛒 Seu Pedido</h3>
        <ul id="lista-carrinho"></ul>
        <p class="carrinho-total">Total: R$ <span id="total-carrinho">0,00</span></p>
        <button id="btn-limpar-carrinho" class="botao" type="button">Limpar</button>
        <button id="btn-finalizar-pedido" class="botao btn-finalizar-pedido" type="button">
            Finalizar Pedido
        </button>
    </aside>

    <div id="footer-placeholder"></div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/carrinho.js"></script>
    <script src="../assets/js/produtos.js"></script>
    <script src="../assets/js/main.js"></script>

</body>
</html>
