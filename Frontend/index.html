<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Burger House — Login</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon/fonts/remixicon.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- LADO ESQUERDO -->
        <div class="login-left">
            <div>
                <h1 class="welcome-title">🔥 Fire Burger House</h1>
                <p class="welcome-sub">Portal de acesso ao sistema</p>
            </div>

            <img src="assets/img/admin/logo-admin.png" alt="Banner Fire Burger House" class="login-image">

            <div>
                <div class="social-media">
                    <a href="#" class="social-icon" aria-label="Facebook"><i class="ri-facebook-fill"></i></a>
                    <a href="#" class="social-icon" aria-label="Instagram"><i class="ri-instagram-line"></i></a>
                    <a href="#" class="social-icon" aria-label="LinkedIn"><i class="ri-linkedin-fill"></i></a>
                </div>
                <p class="footer-note">© 2026 Fire Burger House — Todos os direitos reservados</p>
            </div>
        </div>

        <!-- LADO DIREITO -->
        <div class="login-right">
            <div class="login-form-container">

                <div class="company-logo">
                    <img src="assets/img/admin/banner-empresa.png" alt="Logo Fire Burger House">
                </div>

                <h2 class="login-title">Bem-vindo de volta!</h2>
                <p class="login-subtitle">Escolha seu tipo de acesso e faça login</p>

                <!-- ABAS -->
                <div class="tabs">
                    <button class="tab-btn active" id="tab-admin" type="button">
                        <i class="ri-shield-user-line"></i> Administrador
                    </button>
                    <button class="tab-btn" id="tab-user" type="button">
                        <i class="ri-user-line"></i> Usuário
                    </button>
                </div>

                <!-- CAMPO USUÁRIO -->
                <div class="form-group">
                    <div class="input-wrap">
                        <input type="text" id="username" class="form-input" placeholder=" " autocomplete="username">
                        <label for="username">Usuário</label>
                        <i class="ri-user-line input-icon"></i>
                    </div>
                </div>

                <!-- CAMPO SENHA -->
                <div class="form-group">
                    <div class="input-wrap">
                        <input type="password" id="password" class="form-input" placeholder=" " autocomplete="current-password">
                        <label for="password">Senha</label>
                        <button class="password-toggle" type="button" aria-label="Mostrar senha">
                            <i class="ri-eye-line" id="eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- LEMBRAR -->
                <div class="remember-row">
                    <input type="checkbox" id="remember-me">
                    <label for="remember-me">Lembrar meus dados</label>
                </div>

                <!-- BOTÃO ENTRAR -->
                <button class="btn-login" type="button">
                    <i class="ri-login-box-line"></i>
                    <span id="btn-text">Entrar como Administrador</span>
                </button>

            </div>
        </div>

    </div>

    <script src="assets/js/utils.js"></script>
    <script src="assets/js/main.js"></script>

</body>
</html>
